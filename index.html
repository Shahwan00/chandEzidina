<!DOCTYPE html>
<html lang="ezd" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الإحصاء</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border: none;
            margin-top: 10px;
        }
        button:hover {
            background-color: #218838;
        }
        .lang-switch {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- قائمة اختيار اللغة -->
    <div class="lang-switch">
        <label for="languageSelect">🌐 Ziman / اللغة:</label>
        <select id="languageSelect" onchange="changeLanguage(this.value)">
            <option value="ezd">𐺭𐺍𐺩𐺏𐺪 (Ezidki)</option>
            <option value="ar">العربية (Arabic)</option>
        </select>
    </div>

    <!-- استمارة إدخال البيانات -->
    <div id="formSection">
        <h2 id="form-title">إحصاء العوائل</h2>
        
        <div class="form-group">
            <label id="lbl-person">👤 اسم رئيس العائلة / Person:</label>
            <input type="text" id="person" placeholder="...">
        </div>

        <div class="form-group">
            <label id="lbl-marital">💍 الحالة الاجتماعية / Marital Status:</label>
            <select id="marital">
                <option value="" id="opt-mar-def">اختر الحالة</option>
                <option value="married" id="opt-mar-married">متزوج / Zewicî</option>
                <option value="single" id="opt-mar-single">أعزب / Ezeb</option>
            </select>
        </div>

        <div class="form-group">
            <label id="lbl-class">🏷️ الفئة / Class:</label>
            <select id="classType">
                <option value="" id="opt-cls-def">اختر الفئة</option>
                <option value="family" id="opt-cls-family">عائلة / Malbat</option>
                <option value="individual" id="opt-cls-ind">فرد / Kes</option>
            </select>
        </div>

        <!-- حقل الدولة والمنطقة إدخال نصي -->
        <div class="form-group">
            <label id="lbl-region">📍 اكتب اسم الدولة والمنطقة:</label>
            <input type="text" id="region" placeholder="مثال: ألمانيا - هانوفر">
        </div>

        <div class="form-group">
            <label id="lbl-children">👶 عدد الأطفال / Children:</label>
            <input type="number" id="children" value="0" min="0">
        </div>

        <button id="btn-submit" onclick="addFamily()">حفظ البيانات / Qeyd Bikin</button>
    </div>
</div>

<script>
    // النصوص والترجمات
    const translations = {
        ezd: {
            title: "𐺏𐺡𐺦𐺌𐺢 𐺡𐺢𐺍𐺡𐺝𐺡𐺀𐺕𐺒𐺡𐺀",
            person: "👤 Navê serokê malbatê:",
            marital: "💍 Rewşa zewacê:",
            marDef: "Hilbijêre",
            marMarried: "Zewicî",
            marSingle: "Ezeb",
            class: "🏷️ Pol:",
            clsDef: "Hilbijêre",
            clsFamily: "Malbat",
            clsInd: "Kes",
            region: "📍 Welat u herêmê بنڤێسه:",
            children: "👶 Jmara zarokan:",
            submit: "Qeyd Bikin",
            alertFill: "Ji kerema xwe re hemû cihan tije bikin!",
            regionPlaceholder: "mînak: Allemanya - Hannover"
        },
        ar: {
            title: "إحصاء العوائل",
            person: "👤 اسم رئيس العائلة:",
            marital: "💍 الحالة الاجتماعية:",
            marDef: "اختر الحالة",
            marMarried: "متزوج",
            marSingle: "أعزب",
            class: "🏷️ الفئة:",
            clsDef: "اختر الفئة",
            clsFamily: "عائلة",
            clsInd: "فرد",
            region: "📍 اكتب اسم الدولة والمنطقة:",
            children: "👶 عدد الأطفال:",
            submit: "حفظ البيانات",
            alertFill: "يرجى ملء كافة الحقول المطلوب!",
            regionPlaceholder: "مثال: ألمانيا - هانوفر"
        }
    };

    // تعيين اللغة الافتراضية إلى الإيزيدية
    let currentLang = 'ezd';

    function changeLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];

        document.getElementById("form-title").innerText = t.title;
        document.getElementById("lbl-person").innerText = t.person;
        document.getElementById("lbl-marital").innerText = t.marital;
        document.getElementById("opt-mar-def").innerText = t.marDef;
        document.getElementById("opt-mar-married").innerText = t.marMarried;
        document.getElementById("opt-mar-single").innerText = t.marSingle;
        document.getElementById("lbl-class").innerText = t.class;
        document.getElementById("opt-cls-def").innerText = t.clsDef;
        document.getElementById("opt-cls-family").innerText = t.clsFamily;
        document.getElementById("opt-cls-ind").innerText = t.clsInd;
        document.getElementById("lbl-region").innerText = t.region;
        document.getElementById("region").placeholder = t.regionPlaceholder;
        document.getElementById("lbl-children").innerText = t.children;
        document.getElementById("btn-submit").innerText = t.submit;
    }

    function addFamily() {
        let person = document.getElementById("person").value.trim();
        let marital = document.getElementById("marital").value;
        let classType = document.getElementById("classType").value;
        let regionInput = document.getElementById("region").value.trim();
        let children = parseInt(document.getElementById("children").value) || 0;

        if (!person || !marital || !classType || !regionInput) {
            alert(translations[currentLang].alertFill);
            return;
        }

        // تجهيز المفتاح بشكل آمن لقواعد البيانات مثل Firebase
        let regionKey = regionInput.replace(/[\.\#\$\[\]]/g, "_");

        console.log("Data Saved:", {
            person: person,
            marital: marital,
            classType: classType,
            region: regionKey,
            children: children
        });

        // تنظيف الحقول بعد الحفظ
        document.getElementById("person").value = "";
        document.getElementById("region").value = "";
        document.getElementById("children").value = "0";
        document.getElementById("marital").value = "";
        document.getElementById("classType").value = "";
    }

    // تفعيل اللغة الإيزيدية فور تحميل الصفحة
    window.onload = function() {
        document.getElementById("languageSelect").value = "ezd";
        changeLanguage("ezd");
    };
</script>

</body>
</html>
